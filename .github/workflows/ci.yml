name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest

  docker-smoke-test:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fraud-api .
      - run: docker run -d -p 8000:8000 --name fraud-api fraud-api
      - name: Wait for the API to start
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 1
          done
          docker logs fraud-api
          exit 1
      - name: Score one transaction
        run: |
          curl -sf -X POST http://localhost:8000/score \
            -H "Content-Type: application/json" \
            -d '{"step": 400, "txn_type": "TRANSFER", "amount": 850000}' | tee response.json
          grep -q '"decision"' response.json